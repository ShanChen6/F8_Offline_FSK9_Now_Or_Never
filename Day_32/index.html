<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.6.0/css/all.min.css"
    />
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="play-btn">
      <i class="fa-solid fa-play"></i>
    </div>
    <div class="player">
      <span>00:00</span>
      <div class="progress-bar">
        <div class="progress">
          <span class="timer">00:00</span>
        </div>
      </div>
      <span>00:00</span>
    </div>
    <div class="open-karaoke">
      <button type="button">Karaoke</button>
    </div>
    <div class="karaoke">
      <div class="container">
        <div class="karaoke-header">
          <h2>Karaoke</h2>
          <span class="close">
            <i class="fa-angle-down fa-solid"></i>
          </span>
        </div>
        <div class="karaoke-inner"></div>
      </div>
    </div>
    <audio src="./mp3/thich-em-the-ma.mp3" class="audio"></audio>
    <script src="./js/main.js"></script>
  </body>
</html>
