<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="./css/style.css" />
  </head>
  <body>
    <div class="container">
      <h4 class="title">Doc Editor</h4>
      <div class="controls">
        <div class="main-controls">
          <div class="dropdown">
            <button
              class="btn btn-primary dropdown-toggle"
              data-bs-toggle="dropdown"
            >
              File
            </button>
            <div class="dropdown-menu">
              <button id="new-btn" class="dropdown-item">New</button>
              <button id="new-btn" class="dropdown-item">New</button>
              <button id="pdf-btn" class="dropdown-item">Save as PDF</button>
            </div>
          </div>
          <input type="text" id="filename" value="untitled" />
        </div>
        <div class="control-btn-container">
          <button id="bold-btn" class="btn btn-dark control-btn">
            <b>b</b>
          </button>
          <button id="underline-btn" class="btn btn-dark control-btn">
            <u>u</u>
          </button>
          <button id="italic-btn" class="btn btn-dark control-btn">
            <i>i</i>
          </button>
          <img
            style="
              min-width: 16px;
              min-height: 16px;
              box-sizing: unset;
              box-shadow: none;
              background: unset;
              padding: 0 6px 0 0;
              cursor: pointer;
            "
            src="chrome-extension://ohcpnigalekghcmgcdcenkpelffpdolg/img/icon16.png"
            title='Select with ColorPick Eyedropper - See advanced option: "Add ColorPick Eyedropper near input[type=color] fields on websites"'
            class="colorpick-eyedropper-input-trigger"
          />
          <input
            id="color-btn"
            type="color"
            class="control-btn"
            colorpick-eyedropper-active="true"
          />
        </div>
      </div>
      <div id="content" contenteditable="true" spellcheck="false"></div>
      <div class="d-flex justify-content-end gap-3">
        <span>Số ký tự: <span>0</span></span>
        <span>Số từ: <span>0</span></span>
      </div>
    </div>
    <script src="./js/script.js"></script>
  </body>
</html>
